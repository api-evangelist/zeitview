aid: zeitview
name: Zeitview
description: >-
  Zeitview (formerly DroneBase) is an AI-powered aerial inspection and asset
  intelligence platform. It combines a managed network of drone and aircraft
  pilots with computer-vision analytics and lifecycle asset-management software
  to deliver inspection imagery, condition assessments, and actionable
  intelligence for wind energy, solar, utilities, oil & gas, construction,
  commercial real estate, and property management. As of this profile the
  company operates a customer web platform, support center, and blog but does
  not publish a public developer API, developer portal, or SDK; data access is
  arranged through direct customer engagement.
